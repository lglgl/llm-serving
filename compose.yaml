services:
  llm-serving-llama:
    build:
      context: ./inference/engines/llamacpp
    image: llm-serving-llama:local
    container_name: llm-serving-llama
    restart: unless-stopped
    command:
      - -m
      - /models/qwen2-0_5b-instruct-q4_k_m.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - ${MODEL_ALIAS:-qwen2:0.5b}
      - -c
      - "2048"
      - --metrics
      - --parallel
      - ${LLAMA_PARALLEL_SLOTS:-4}
    ports:
      - "8081:8080"
    healthcheck:
      # 等待模型 API 就绪后再启动 FastAPI。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  api:
    build:
      context: ./gateway
    image: llm-serving:local
    container_name: llm-serving
    restart: unless-stopped
    depends_on:
      llm-serving-llama:
        condition: service_healthy
    environment:
      LLAMA_BASE_URL: http://llm-serving-llama:8080/v1
      DEFAULT_MODEL: ${MODEL_ALIAS:-qwen2:0.5b}
      LLAMA_PARALLEL_SLOTS: ${LLAMA_PARALLEL_SLOTS:-4}
      LLM_QUEUE_TIMEOUT_SECONDS: ${LLM_QUEUE_TIMEOUT_SECONDS:-300}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-development}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-true}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      # 通过应用自身健康接口同时确认 FastAPI 和模型后端可用。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
