apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-serving
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: llm-serving
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000