apiVersion: v1
kind: Service
metadata:
  name: llm-serving
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: llm-serving
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
metadata:
  labels:
    app: llm-serving