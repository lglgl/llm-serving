apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-serving-ollama
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: llm-serving-ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: llm-serving
      ports:
        - protocol: TCP
          port: 11434