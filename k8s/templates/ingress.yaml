apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-serving
  namespace: llm-serving
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /llm-serving
            pathType: Prefix
            backend:
              service:
                name: llm-serving
                port:
                  number: 8000
