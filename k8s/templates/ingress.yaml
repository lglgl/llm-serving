apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-serving
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx
  rules:
    - host: llm-serving.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-serving
                port:
                  number: 8000