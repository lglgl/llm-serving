apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-serving
  namespace: llm-serving
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - llm-serving
  selector:
    matchLabels:
      app: llm-serving
  endpoints:
    - port: http
      path: /metrics
      interval: 30s