namespace: llm-serving

image:
  repository: harbor.local:30080/library/llm-serving
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

llama:
  baseUrl: "http://llm-serving-llama:8080/v1"
  model: "qwen2:0.5b"

llamaImage:
  repository: harbor.local:30080/library/llm-serving-llama
  tag: "latest"
  pullPolicy: Always

resources:
  fastapi:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  llama:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi