{{- if .Values.mockBackend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-serving-pilot.fullname" . }}-mock
  labels:
    {{- include "llm-serving-pilot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-serving-pilot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mock-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llm-serving-pilot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mock-backend
    spec:
      containers:
        - name: mock-backend
          image: "{{ .Values.mockBackend.image.repository }}:{{ .Values.mockBackend.image.tag }}"
          imagePullPolicy: {{ .Values.mockBackend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.mockResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-serving-pilot.fullname" . }}-mock
  labels:
    {{- include "llm-serving-pilot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "llm-serving-pilot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mock-backend
  ports:
    - name: http
      port: 8001
      targetPort: http
{{- end }}
