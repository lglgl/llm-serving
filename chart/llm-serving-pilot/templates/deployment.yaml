apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-serving-pilot.fullname" . }}
  labels:
    {{- include "llm-serving-pilot.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "llm-serving-pilot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "llm-serving-pilot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        pilot.llm-serving/revision: {{ .Values.deploymentStamp | quote }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DEFAULT_MODEL
              value: {{ .Values.model.alias | quote }}
            - name: VLLM_MODEL
              value: {{ .Values.model.upstream | quote }}
            - name: VLLM_API_BASE
              value: {{ if .Values.mockBackend.enabled }}{{ printf "http://%s-mock:8001/v1" (include "llm-serving-pilot.fullname" .) | quote }}{{ else }}{{ .Values.model.apiBase | quote }}{{ end }}
            - name: REQUEST_TIMEOUT
              value: {{ .Values.model.requestTimeout | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-serving-pilot.fullname" . }}
  labels:
    {{- include "llm-serving-pilot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "llm-serving-pilot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
