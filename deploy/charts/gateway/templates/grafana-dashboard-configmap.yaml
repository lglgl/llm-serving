{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-serving-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  llm-serving-performance.json: |-
{{ .Files.Get "dashboards/llm-serving-performance.json" | indent 4 }}
{{- end }}
