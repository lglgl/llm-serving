apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-serving
  namespace: {{ .Release.Namespace }}
  labels:
    app: llm-serving
spec:
  replicas: 1

  # 滚动更新：尽量保持更新期间服务可用
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: llm-serving

  template:
    metadata:
      labels:
        app: llm-serving
    spec:
      # 使用专用 ServiceAccount；该账号不需要访问 Kubernetes API
      serviceAccountName: llm-serving
      automountServiceAccountToken: false

      # 容器正常退出时预留的终止时间
      terminationGracePeriodSeconds: 30

      containers:
        - name: llm-serving
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # 从 ConfigMap 注入 llama.cpp 地址、默认模型和并发槽位配置。
          envFrom:
            - configMapRef:
                name: llm-serving-config

          # CPU 和内存资源配置由 values.yaml 统一管理
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # 启动探针：确认 FastAPI 端口已经开始监听
          # 在启动探针成功前，Readiness 和 Liveness 不会执行
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          # 就绪探针：调用 /health。
          # /health 在 llama.cpp 不可用时返回 503，从而使 Pod 被移出 Service 后端，
          # 实现 fail-closed（不再把流量转发到无法推理的实例）。
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 存活探针：仅检查 FastAPI 端口是否仍可接受 TCP 连接
          # 避免 llama.cpp 短暂不可用时，仅因依赖异常就反复重启 FastAPI
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
