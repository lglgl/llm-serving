apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-serving
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: llm-serving
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.namespace }}
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      ports:
        - protocol: TCP
          port: 8000
