image:
  repository: harbor.local:30080/library/llm-serving
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

# 旧 Helm Release 曾把 Namespace 纳入 release 清单时，仅供一次性迁移使用。
# 正常安装必须保持 false，由部署平台或 --create-namespace 创建 Namespace。
namespaceMigration:
  keepLegacyResource: false

# 共享模型配置；部署时由 deploy/values/model.yaml 覆盖。
model:
  alias: "qwen2:0.5b"
  parallel: 4

# 推理服务的 OpenAI-compatible 地址，由 inference Chart 的 Service 提供。
backend:
  baseUrl: "http://llm-serving-llama:8080/v1"

monitoring:
  # 平台 Prometheus 所在的 Namespace，用于网络策略放通。
  namespace: observability
  scrapeInterval: 15s
  prometheusRelease: kube-prometheus-stack
  grafanaDashboard:
    enabled: true

ingress:
  # devops-platform 的 ingress-nginx Controller 所在 Namespace。
  namespace: ingress

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
