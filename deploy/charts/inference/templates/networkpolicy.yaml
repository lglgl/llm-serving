apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-serving-llama
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: llm-serving-llama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.gateway.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      ports:
        - protocol: TCP
          port: 8080
