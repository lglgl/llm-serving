    dtype: auto
    quantization: awq
    tp: [1, 2, 4, 8]
    approx_gb: 10
  qwen3-32b:
    modelscope_id: Qwen/Qwen3-32B
    dir: Qwen3-32B
    dtype: bfloat16
    quantization: ""
